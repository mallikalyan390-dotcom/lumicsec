name: Lockfile verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
